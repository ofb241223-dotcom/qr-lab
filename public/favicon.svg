<svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  {/* QR Finder Pattern Outer Box */}
  <rect x="2" y="2" width="9" height="9" rx="1" stroke="#ff5500" strokeWidth="2.5" />
  {/* QR Finder Solid Center */}
  <rect x="5" y="5" width="3" height="3" fill="#ff5500" />
  
  {/* Concentric frequency dot dials on the right */}
  <circle cx="16" cy="3" r="1.5" fill="#00d5ff" />
  <circle cx="21" cy="3" r="1.5" fill="#626779" />
  <circle cx="16" cy="8" r="1.5" fill="#626779" />
  <circle cx="21" cy="8" r="1.5" fill="#ff5500" />

  {/* Tactical synthesizer key switch frames */}
  <rect x="2" y="15" width="5" height="7" rx="0.5" fill="#626779" opacity="0.6" />
  <rect x="9" y="15" width="5" height="7" rx="0.5" fill="#ff5500" />
  <rect x="16" y="15" width="6" height="7" rx="0.5" fill="#626779" opacity="0.6" />
  <line x1="11.5" y1="17.5" x2="11.5" y2="19.5" stroke="#ffffff" strokeWidth="1" />
</svg>